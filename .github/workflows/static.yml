# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Stage the published files
        # The deploy used to upload the whole checkout, so CLAUDE.md, .claude/,
        # the git hooks, the Tailwind source, the build tools and the image
        # prompt notes were all served at guessable URLs, linked from nothing.
        # tools/ also held the walkthrough shell, which renders an empty deck.
        # Everything a page links to (data/, downloads/, the replication code,
        # data.json, manifest.json) is still staged; tools/check_publish.py
        # asserts both halves.
        run: python3 tools/check_publish.py --stage _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # styles.css is built and committed locally (npm run build:css) and
          # kept fresh by the staleness guard in validate.yml, so the deploy
          # stays a static upload with no build dependencies.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
