name: Validate HTML & links

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Only the site is published, and every page link resolves
        run: python3 tools/check_publish.py

      - name: The writing rules hold on every page
        # No em dashes, no "not only", none of the stock vocabulary, in every
        # published page and the files it is built from. Verbatim quotations
        # are exempted one by one in the script, with a reason.
        run: python3 tools/check_writing.py

      - name: Every page is indexed on purpose or excluded on purpose
        run: python3 tools/check_indexability.py

      # There is no shared stylesheet: each page carries its own :root block, so
      # a colour fixed on one page is fixed on one page and nothing says so.
      # --accent was darkened on the homepage first and the other 46 copies kept
      # the value that fails (4.44:1 on the cream paper every essay sits on).
      - name: Palette copies agree, and every pair clears AA
        run: python3 tools/check_palette.py

      - name: Check JSON validity
        run: |
          python3 -c "import json; json.load(open('data.json')); print('data.json OK')"
          python3 -c "
          import json, sys
          m = json.load(open('manifest.json'))
          assert 'name' in m and 'start_url' in m
          print('manifest.json OK')
          "

      - name: Check for broken internal links
        # Every generated page, not only the front page: the data pages, the
        # analyses and the explainers are where most links live now.
        run: |
          python3 -c "
          import re, os, sys, glob
          pages = ['index.html'] + glob.glob('explore/**/index.html', recursive=True) + glob.glob('analysis/*.html') \\
                  + ['inflation/index.html', 'care/index.html', 'walkthrough/index.html', 'updates.html']
          missing = []
          n = 0
          for p in pages:
              html = open(p, encoding='utf-8').read()
              for h in set(re.findall(r'(?<![:\\w-])href=\"([^\"#][^\"]*?)\"', html)):
                  if h.startswith(('http', 'data:', 'mailto:')) or '+' in h:  # '+' marks a JS-built href
                      continue
                  n += 1
                  path = h.split('#')[0].split('?')[0]
                  path = os.path.normpath(os.path.join(os.path.dirname(p), path)) if not path.startswith('/') else path.lstrip('/')
                  if path and not os.path.exists(path):
                      missing.append((p, h))
          if missing:
              print('Broken local links:', missing)
              sys.exit(1)
          print(f'All {n} local links valid across {len(pages)} pages')
          "

      - name: Check for stale date references
        # Reject a data-vintage label such as "data through <Month> 2025" or
        # "updated <Month> 2025" in index.html or downloads/: those are leftovers
        # from an earlier release. A dated event ("raised in April 2025", "the
        # press release of 25 February 2025") is a fact, not a vintage, and passes.
        run: |
          ! grep -rEi '(through|as of|updated|last updated|data to|current to) (January|February|March|April|May|June|July|August|September|October|November|December) 2025\b' \
              index.html explore/ analysis/ downloads/ --include='*.html' || {
            echo "ERROR: Stale <Month> 2025 references found (see hits above)"
            exit 1
          }
          echo "No stale 2025-month references"

      - name: Validate sitemap
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('sitemap.xml OK')"

      - name: Check JS brace balance in every page's inline scripts
        run: |
          python3 -c "
          import re, glob
          pages = ['index.html'] + glob.glob('explore/**/index.html', recursive=True)
          for p in pages:
              s = ''.join(re.findall(r'<script[^>]*>(.*?)</script>', open(p, encoding='utf-8').read(), re.DOTALL))
              o, c = s.count('{'), s.count('}')
              assert o == c, f'{p}: brace mismatch {o} != {c}'
          print(f'inline JS braces balance in {len(pages)} pages')
          "

      - name: Check data parity (estimates do not overlap outturns, data.json == index engine)
        run: python3 tools/check_data_parity.py

      - name: Check generated artifacts are up to date
        # analysis/, updates.html, feed.xml, sitemap.xml and the downloads/ dataset
        # exports are all built from data/. The Pages deploy is a pure static upload,
        # so the committed copies are what ship — same contract as styles.css.
        #
        # Order matters: build_site.py packages the paper's HTML and PDF into the
        # research-package ZIP, so the paper has to be built first or the ZIP is stale,
        # and the sitemap lists the /explore/ pages, so those come before build_site.
        run: |
          python3 tools/build_paper.py --check
          python3 tools/build_projections.py --check
          python3 tools/build_explore.py --check
          python3 tools/build_site.py --check
          python3 tools/build_master.py --check
          python3 tools/build_front.py --check
          python3 tools/build_og.py --check
          python3 replication_code.py

      - name: Check downloads/ docs agree with data.json
        run: python3 tools/check_docs_consistency.py

      - name: Check every published V-Dem figure is on one index
        run: python3 tools/check_vdem_basis.py
