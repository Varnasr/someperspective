name: Validate HTML & links

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check committed styles.css is up to date
        # Rebuild Tailwind and fail if the committed styles.css is stale —
        # the same drift guard the data-parity check applies to data.json.
        run: |
          npm ci
          npm run build:css
          if ! git diff --quiet -- styles.css; then
            echo "ERROR: styles.css is out of date. Run 'npm run build:css' and commit the result."
            git diff --stat -- styles.css
            exit 1
          fi
          echo "styles.css is up to date"

      - name: Check JSON validity
        run: |
          python3 -c "import json; json.load(open('data.json')); print('data.json OK')"
          python3 -c "
          import json, sys
          m = json.load(open('manifest.json'))
          assert 'name' in m and 'start_url' in m
          print('manifest.json OK')
          "

      - name: Check for broken internal links
        run: |
          python3 -c "
          import re, os, sys
          html = open('index.html').read()
          # Negative lookbehind skips Alpine bindings (:href=\"expr\", x-bind:href=\"expr\"),
          # whose values are JS expressions rather than URLs and are not files on disk.
          hrefs = set(re.findall(r'(?<![:\w-])href=\"([^\"#][^\"]*?)\"', html))
          local = [h for h in hrefs if not h.startswith('http') and not h.startswith('data:') and not h.startswith('mailto:')]
          # A URL is not a filename: strip the query string and fragment before testing
          # existence. /styles.css?v=2.42.0 is a request for styles.css, and treating the
          # cache-buster as part of the path made this step fail for eight consecutive runs.
          # Root-relative URLs (e.g. /manifest.json) are served from the repo root, so check them relative to the repo.
          def as_path(h):
              return h.split('#')[0].split('?')[0].lstrip('/')
          missing = [h for h in local if as_path(h) and not os.path.exists(as_path(h))]
          if missing:
              print('Broken local links:', missing)
              sys.exit(1)
          print(f'All {len(local)} local links valid')
          "

      - name: Check for stale date references
        # Reject any "<Month> 2025" string in index.html or downloads/.
        # 2025 is the last calendar year before the current data cutoff;
        # any 2025-month string is a leftover from an earlier release.
        run: |
          ! grep -rE '\b(January|February|March|April|May|June|July|August|September|October|November|December) 2025\b' \
              index.html downloads/ --include='*.html' || {
            echo "ERROR: Stale <Month> 2025 references found (see hits above)"
            exit 1
          }
          echo "No stale 2025-month references"

      - name: Validate sitemap
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('sitemap.xml OK')"

      - name: Check JS brace balance in index.html
        run: |
          python3 -c "
          import re
          html = open('index.html').read()
          s = ''.join(re.findall(r'<script[^>]*>(.*?)</script>', html, re.DOTALL))
          o, c = s.count('{'), s.count('}')
          print(f'inline JS braces: {o} open, {c} close')
          assert o == c, f'Brace mismatch: {o} != {c}'
          "

      - name: Check data parity (inline fallback == data.json == index engine)
        run: python3 tools/check_data_parity.py

      - name: Check generated artifacts are up to date
        # analysis/, updates.html, feed.xml, sitemap.xml and the downloads/ dataset
        # exports are all built from data/. The Pages deploy is a pure static upload,
        # so the committed copies are what ship — same contract as styles.css.
        #
        # Order matters: build_site.py packages the paper's HTML and PDF into the
        # research-package ZIP, so the paper has to be built first or the ZIP is stale.
        run: |
          python3 tools/build_paper.py --check
          python3 tools/build_site.py --check

      - name: Check downloads/ docs agree with data.json
        run: python3 tools/check_docs_consistency.py

      - name: Check every published V-Dem figure is on one index
        run: python3 tools/check_vdem_basis.py

      - name: Check the stylesheet cache-buster matches the page version
        # index.html links /styles.css?v=<version>. If the two drift, a returning
        # visitor can pair new markup with a 10-minute-old stylesheet (GitHub Pages
        # serves everything with max-age=600).
        run: |
          python3 -c "
          import re, sys
          h = open('index.html').read()
          ver = re.search(r'<meta name=\"version\" content=\"([^\"]+)\"', h).group(1)
          css = re.search(r'href=\"/styles\.css\?v=([^\"]+)\"', h)
          assert css, 'styles.css link is missing its ?v= cache-buster'
          assert css.group(1) == ver, f'styles.css?v={css.group(1)} != version meta {ver}'
          print(f'styles.css cache-buster matches version {ver}')
          "

